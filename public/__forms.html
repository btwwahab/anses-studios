<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="robots" content="noindex" /><title>forms</title></head>
  <body>
    <!-- Static copy of the contact form so Netlify can detect it at build time. -->
    <form name="project-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="project-enquiry" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="projectType" />
      <input name="budget" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
